services:
  - type: web
    name: rick-aryan-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rick-aryan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: rick-aryan-db
    databaseName: rick_aryan
    plan: starter
